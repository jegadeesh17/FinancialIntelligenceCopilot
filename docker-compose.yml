services:
  # FastAPI backend — matches the Dockerfile's CMD (uvicorn api.main:app) and
  # the container actually deployed to Cloud Run. This is what `docker compose up`
  # brings up by default.
  api:
    build: .
    container_name: financial-compliance-api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
    env_file:
      - .env
    volumes:
      - ./data/raw_pdfs:/app/data/raw_pdfs
      - ./data/chroma_db:/app/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
